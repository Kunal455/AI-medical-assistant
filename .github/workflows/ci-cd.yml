name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
 
  node-backend-ci:
    name: Node Backend Test Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: ./node-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./node-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        env:
          MONGO_URI: mongodb://localhost:27017/medassist_test
          JWT_SECRET: test_secret_key
        run: npm test

  
  python-backend-ci:
    name: Python Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          GEMINI_API_KEY: fake_api_key_for_testing
        run: pytest

 
  frontend-ci:
    name: Frontend Build & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build Frontend
        run: npm run build


  docker-compose-check:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Images
        run: docker compose build

 
  deploy:
    name: Deploy to Production
    needs: [node-backend-ci, python-backend-ci, frontend-ci, docker-compose-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # Convert repository owner to lowercase for registry namespace
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG=latest
          
          # Build & Push Python Backend
          docker build -t ghcr.io/$OWNER/medassist-python-backend:$TAG ./backend
          docker push ghcr.io/$OWNER/medassist-python-backend:$TAG
          
          # Build & Push Node Backend
          docker build -t ghcr.io/$OWNER/medassist-node-backend:$TAG ./node-backend
          docker push ghcr.io/$OWNER/medassist-node-backend:$TAG
          
          # Build & Push Frontend
          docker build -t ghcr.io/$OWNER/medassist-frontend:$TAG ./frontend
          docker push ghcr.io/$OWNER/medassist-frontend:$TAG
